<!DOCTYPE html>
<html lang="tr" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mola Sırası</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600&family=Dongle&display=swap"
    rel="stylesheet"
  />

  <style>
    /* -------- TÜM CSS AYNI, ÇALIŞAN SÜRÜM -------- */

    :root {
      --primary-color: #002f6c;
      --light-bg: #ffffff;
      --info-bg: #eaf4fc;
      --button-bg: #FE9418;
      --button-hover-bg: #ff7b28;
      --turknet-yellow: #f9a825;
      --font-family: "Inter", Helvetica, Arial, sans-serif;
      --border-radius: 12px;
      --table-header-bg: #eaf4fc;
      --table-row-even: #f9f9f9;
      --text-muted: #555555;
      --color-bg1: rgb(108, 0, 162);
      --color-bg2: rgb(0, 17, 82);
      --color1: 18, 113, 255;
      --color2: 221, 74, 255;
      --color3: 100, 220, 255;
      --color4: 200, 50, 50;
      --color5: 180, 180, 50;
      --color-interactive: 140, 100, 255;
      --circle-size: 80%;
      --blending: hard-light;
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      background: transparent;
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--primary-color);
    }

    .gradient-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(40deg, var(--color-bg1), var(--color-bg2));
      z-index: 0;
    }

    .gradients-container {
      filter: url(#goo) blur(40px);
      width: 100%;
      height: 100%;
    }

    .g1, .g2, .g3, .g4, .g5, .interactive {
      position: absolute;
      mix-blend-mode: var(--blending);
      background: radial-gradient(circle at center, rgba(var(--color1), 0.8) 0, rgba(var(--color1), 0) 50%);
      width: var(--circle-size);
      height: var(--circle-size);
      top: calc(50% - var(--circle-size) / 2);
      left: calc(50% - var(--circle-size) / 2);
    }

    .card {
      background: var(--light-bg);
      border-radius: var(--border-radius);
      padding: 24px;
      width: 380px;
      z-index: 2;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .logo img { height: 45px; }

    .title {
      font-size: 2.4rem;
      font-weight: 600;
      color: rgb(78,0,82);
    }

    .info-box {
      background: linear-gradient(90deg, #ffeffe, #fff8ff);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      color: rgb(78,0,82);
      text-align: center;
    }

    .btn-primary {
      width: 100%;
      display: block;
      background: rgb(78,0,82);
      color: #fff;
      padding: 12px 0;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 24px;
      text-decoration: none;
      font-weight: 500;
    }

    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--light-bg);
      color: rgb(78,0,82);
    }

    thead { background: linear-gradient(90deg, #ffeefe, #fff8ff); }

    th, td {
      padding: 12px 8px;
      text-align: left;
    }

    tbody tr:nth-child(even) { background: var(--table-row-even); }

    .placeholder {
      text-align: center;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: var(--light-bg);
      border-radius: 12px;
      width: min(640px, 95vw);
      padding: 16px;
    }
    iframe { width: 100%; height: 480px; border: 0; border-radius: 8px; }
  </style>
</head>

<body>

  <div class="gradient-bg">
    <svg><defs><filter id="goo"><feGaussianBlur in="SourceGraphic" stdDeviation="10" /></filter></defs></svg>
    <div class="gradients-container">
      <div class="g1"></div><div class="g2"></div><div class="g3"></div>
      <div class="g4"></div><div class="g5"></div><div class="interactive"></div>
    </div>
  </div>

  <div class="card">
    <h1 class="title">Mola Sırası</h1>

    <div class="info-box">Sıra bilgisi her <strong>5 saniyede</strong> güncellenir.</div>
    <div class="info-box"><p class="degisken"></p></div>

    <a href="https://forms.gle/bMmRf2wX3MPEyu3K7" id="joinQueueBtn" class="btn-primary">Sıraya Katıl</a>

    <div class="table-wrapper">
      <table id="molaTable">
        <thead>
          <tr><th>#</th><th>Zaman Damgası</th><th>Ad Soyad</th></tr>
        </thead>
        <tbody>
          <tr><td colspan="3" class="placeholder">Veri yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer">
      <div class="version">v2</div>
      <small>© 2025 Geliştiriciler: Ahmet Can İnceoğlu ve Umut Ablay</small>
    </div>
  </div>

  <div id="formModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="modal-title">Mola Sırasına Katıl</div>
        <button id="closeFormModal" style="background:none;border:none;font-size:20px;">✕</button>
      </div>
      <iframe src="https://forms.gle/bMmRf2wX3MPEyu3K7"></iframe>
    </div>
  </div>

  <script>
    const SHEET_ID = "1e76vIg2R_du1QcIabDJK7eqxEOV8lic3z3r9Vi9-dRQ";
    const QUEUE_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Form Responses 1&tqx=out:json`;
    const WARNING_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Uyarı/Bilgilendirme Mesajı&tqx=out:json`;

    let previous = [];

    async function refreshQueue() {
      const tbody = document.querySelector("#molaTable tbody");

      try {
        const res = await fetch(`${QUEUE_URL}&cache=${Date.now()}`);
        const txt = await res.text();
        const json = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
        const rows = json.table.rows || [];

        const filtered = rows.filter(r => r.c[0]?.v && r.c[1]?.v);

        tbody.innerHTML = "";
        filtered.forEach((r, i) => {
          tbody.innerHTML +=
            `<tr><td>${i+1}</td><td>${r.c[0].f || r.c[0].v}</td><td>${r.c[1].v}</td></tr>`;
        });

        if (filtered.length === 0)
          tbody.innerHTML = `<tr><td colspan="3" class="placeholder">Listede kimse yok.</td></tr>`;

      } catch {
        tbody.innerHTML = `<tr><td colspan="3" class="placeholder">Veri yüklenemedi.</td></tr>`;
      }
    }

    async function refreshWarning() {
      try {
        const res = await fetch(`${WARNING_URL}&cache=${Date.now()}`);
        const txt = await res.text();
        const json = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
        const msg = json.table.rows?.[0]?.c?.[1]?.v || "";
        document.querySelector(".degisken").innerText = msg;
      } catch {
        document.querySelector(".degisken").innerText = "";
      }
    }

    window.onload = () => {
      refreshQueue();
      refreshWarning();
      setInterval(() => {
        refreshQueue();
        refreshWarning();
      }, 5000);
    };
  </script>
</body>
</html>
